services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-engineering-certification:latest
    container_name: data_engineer_course
    working_dir: /workspace
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./:/workspace
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' --ServerApp.root_dir=/workspace --ServerApp.preferred_dir=/workspace
  
  postgres:
    image: postgres:15
    container_name: course_postgres
    environment:
      POSTGRES_DB: dataengineering
      POSTGRES_USER: datacourse
      POSTGRES_PASSWORD: datacourse123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: course_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: datacourse
      MONGO_INITDB_ROOT_PASSWORD: datacourse123
    ports:
      - "27017:27017"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: course_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: